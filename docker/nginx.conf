# Прод-конфиг фронта: статика SPA + прокси /api на контейнер API.
#
# Один домен для фронта и API — отсюда «CORS не нужен» в решениях проекта:
# браузер видит один origin, а nginx разводит запросы по бэкендам.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Загрузка документов идёт через этот прокси: лимит согласован с nginx
    # и php-fpm бэкенда (25m / post_max_size 25M), иначе большой файл
    # отклонялся бы здесь, не доходя до API.
    client_max_body_size 25m;

    # API. Имя upstream'а — сервис в compose-сети (см. docker-compose.yml).
    location /api/ {
        proxy_pass http://${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Собранные ассеты Vite содержат хеш в имени и при выкладке новой версии
    # получают новые имена — их можно кэшировать «навсегда».
    location /assets/ {
        # Только add_header: директива expires добавила бы свой Cache-Control,
        # и в ответе оказалось бы два разных заголовка.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html кэшировать нельзя: он ссылается на конкретные хешированные
    # ассеты, и закэшированная старая копия после выкладки тянула бы файлы,
    # которых в образе уже нет — «белый экран до Ctrl+F5».
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-fallback: маршруты вида /tenders/{id} обслуживает роутер в браузере,
    # на сервере таких файлов нет.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
