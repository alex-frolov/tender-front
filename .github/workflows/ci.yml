name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # vite 8 / oxlint требуют ^20.19 || >=22.12
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # `npm run build` = `tsc -b && vite build`, тайпчек входит в билд
      - name: Typecheck & build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7
