name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # vite 8 / oxlint требуют ^20.19 || >=22.12
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # `npm run build` = `tsc -b && vite build`, тайпчек входит в билд
      - name: Typecheck & build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      # Прод-образ собирается здесь, а не только на деплое: сборка ходит в
      # реестр npm и падает от любой рассинхронизации lock-файла с Dockerfile,
      # а поймать это лучше на PR, чем при выкладке.
      - name: Build web image
        run: docker build -f docker/web.Dockerfile --target web -t tender-front:ci .

      # Конфиг nginx не проверяется сборкой: он шаблон, и синтаксис виден
      # только после подстановки переменных штатным entrypoint'ом.
      - name: Validate nginx config
        run: |
          docker run --rm -e API_UPSTREAM=web:80 --entrypoint sh tender-front:ci -c \
            'envsubst "\$API_UPSTREAM" < /etc/nginx/templates/default.conf.template \
              > /etc/nginx/conf.d/default.conf && nginx -t'
